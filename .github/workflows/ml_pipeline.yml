# Level Up ML Pipeline — CI/CD
# Automates: data refresh → train → validate → bias detection → registry push
# With failure notifications and rollback support.

name: ML Pipeline

on:
  push:
    branches: [main]
    paths:
      - "ML-Pipeline/**"
      - "Data-Pipeline/scripts/**"
      - ".github/workflows/ml_pipeline.yml"
  workflow_dispatch:
    inputs:
      skip_tuning:
        description: "Skip hyperparameter tuning"
        required: false
        default: false
        type: boolean
      force_push:
        description: "Force push to registry even if validation marginal"
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly on Sundays at 3 AM UTC
    - cron: "0 3 * * 0"

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_TRACKING_URI: "file://./ML-Pipeline/mlruns"

jobs:
  # ── Job 1: Run data pipeline to generate fresh data ──
  data-pipeline:
    name: Data Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install data pipeline dependencies
        run: |
          pip install pandas>=2.0.0 pyarrow>=14.0.0 numpy>=1.24.0 \
                      requests>=2.31.0 pytest>=7.4.0

      - name: Generate synthetic data
        working-directory: Data-Pipeline
        run: python scripts/generate_synthetic.py

      - name: Validate schema
        working-directory: Data-Pipeline
        run: python scripts/validate_schema.py

      - name: Preprocess data
        working-directory: Data-Pipeline
        run: |
          python scripts/preprocess_sleep.py
          python scripts/preprocess_quiz.py
          python scripts/build_features.py
          python scripts/generate_stats.py
          python scripts/bias_report.py

      - name: Run data pipeline tests
        working-directory: Data-Pipeline
        run: python -m pytest tests/ -v --tb=short

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: Data-Pipeline/data/processed/
          retention-days: 7

  # ── Job 2: Train ML model ──
  train:
    name: Model Training
    needs: data-pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ML dependencies
        run: pip install -r ML-Pipeline/requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Data-Pipeline/data/processed/

      - name: Hyperparameter tuning
        if: ${{ github.event.inputs.skip_tuning != 'true' }}
        working-directory: ML-Pipeline
        run: python hyperparameter_tuning.py

      - name: Train model
        working-directory: ML-Pipeline
        run: |
          if [ -f models/best_params.json ]; then
            python train_model.py models/best_params.json
          else
            python train_model.py
          fi

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            ML-Pipeline/models/
            ML-Pipeline/mlruns/
          retention-days: 30

  # ── Job 3: Validate model (quality gate) ──
  validate:
    name: Model Validation
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ML-Pipeline/requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Data-Pipeline/data/processed/

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ML-Pipeline/

      - name: Run validation
        working-directory: ML-Pipeline
        run: python validate_model.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            ML-Pipeline/reports/validation_report.json
            ML-Pipeline/plots/validation_diagnostics.png

  # ── Job 4: Bias detection ──
  bias-detect:
    name: Bias Detection
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ML-Pipeline/requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Data-Pipeline/data/processed/

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ML-Pipeline/

      - name: Run bias detection
        working-directory: ML-Pipeline
        run: python model_bias_detection.py

      - name: Run SHAP sensitivity analysis
        working-directory: ML-Pipeline
        run: python sensitivity_analysis.py

      - name: Upload bias & SHAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-shap-reports
          path: |
            ML-Pipeline/reports/
            ML-Pipeline/plots/

  # ── Job 5: Push to registry ──
  registry-push:
    name: Registry Push
    needs: [validate, bias-detect]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ML-Pipeline/requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Data-Pipeline/data/processed/

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ML-Pipeline/

      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          name: validation-report
          path: ML-Pipeline/reports/

      - name: Download bias reports
        uses: actions/download-artifact@v4
        with:
          name: bias-shap-reports
          path: ML-Pipeline/

      - name: Load environment variables
        run: |
          grep -v '^#' LevelUp/.env | grep '=' >> $GITHUB_ENV || true

      - name: Export model to JSON
        working-directory: ML-Pipeline
        run: python export_model.py

      - name: Push to registry
        working-directory: ML-Pipeline
        run: python registry_push.py

      - name: Upload exported model
        uses: actions/upload-artifact@v4
        with:
          name: exported-model
          path: ML-Pipeline/models/model_weights.json
          retention-days: 90

  # ── Job 6: Notify on failure ──
  notify:
    name: Failure Notification
    needs: [data-pipeline, train, validate, bias-detect, registry-push]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Notify via Slack
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ Level Up ML Pipeline FAILED\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nBranch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}"
            }'

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 ML Pipeline Failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `## ML Pipeline Failure\n\n- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **Branch**: ${context.ref}\n- **Triggered by**: ${context.actor}\n\nPlease investigate the failure and re-run if needed.`,
              labels: ['bug', 'ml-pipeline']
            })

  # ── Job 7: Rollback on validation failure ──
  rollback:
    name: Rollback
    needs: validate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ML-Pipeline/requirements.txt

      - name: Load environment variables
        run: |
          grep -v '^#' LevelUp/.env | grep '=' >> $GITHUB_ENV || true

      - name: Rollback to previous model
        working-directory: ML-Pipeline
        run: |
          echo "⚠️ Validation failed. Attempting rollback..."
          python registry_push.py rollback || echo "No previous version to rollback to."

      - name: Notify rollback
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{"text": "⚠️ Level Up ML Pipeline: Validation failed — rolled back to previous model version."}'
