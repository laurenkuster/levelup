<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>LevelUP Profile</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#257bf4",
            "background-light": "#f5f7f8",
            "background-dark": "#1a1b26",
            "system-green": "#0bda5e",
            "system-red": "#ff4757",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"],
            "pixel": ["'Press Start 2P'", "cursive"],
          },
          boxShadow: {
            'neon': '0 0 10px rgba(37, 123, 244, 0.5), inset 0 0 2px rgba(37, 123, 244, 0.3)',
            'neon-red': '0 0 8px rgba(255, 71, 87, 0.4)',
            'neon-green': '0 0 8px rgba(11, 218, 94, 0.4)',
          },
          backgroundImage: {
            'scanlines': 'linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06))',
          }
        },
      },
    }
  </script>
  <style>
    .scanline-overlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      z-index: 40;
      pointer-events: none;
    }

    .scanline-overlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: rgba(18, 16, 16, 0.1);
      opacity: 0;
      z-index: 40;
      pointer-events: none;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% {
        opacity: 0.02795
      }

      5% {
        opacity: 0.03487
      }

      10% {
        opacity: 0.0413
      }

      15% {
        opacity: 0.07632
      }

      20% {
        opacity: 0.02986
      }

      25% {
        opacity: 0.05267
      }

      30% {
        opacity: 0.02943
      }

      35% {
        opacity: 0.08836
      }

      40% {
        opacity: 0.04604
      }

      45% {
        opacity: 0.0205
      }

      50% {
        opacity: 0.06552
      }

      55% {
        opacity: 0.08942
      }

      60% {
        opacity: 0.05315
      }

      65% {
        opacity: 0.08154
      }

      70% {
        opacity: 0.03488
      }

      75% {
        opacity: 0.06202
      }

      80% {
        opacity: 0.04014
      }

      85% {
        opacity: 0.07636
      }

      90% {
        opacity: 0.02805
      }

      95% {
        opacity: 0.06941
      }

      100% {
        opacity: 0.03057
      }
    }

    .pixel-border {
      box-shadow: -2px 0 0 0 #257bf4, 2px 0 0 0 #257bf4, 0 -2px 0 0 #257bf4, 0 2px 0 0 #257bf4;
      margin: 2px;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1b26;
    }

    ::-webkit-scrollbar-thumb {
      background: #257bf4;
    }

    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body
  class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col overflow-hidden relative scanline-overlay">
  <header
    class="flex items-center justify-between px-5 pt-6 pb-4 bg-background-dark/90 sticky top-0 z-30 border-b border-primary/30 backdrop-blur-sm">
    <a href="status.html" class="inline-flex items-center gap-1 text-primary text-sm font-bold"><span
        class="material-symbols-outlined">arrow_back</span>BACK</a>
    <h1 class="text-white text-lg font-pixel tracking-wider text-primary">PROFILE</h1>
    <a href="status.html" class="text-slate-400 hover:text-primary transition-colors"><span
        class="material-symbols-outlined">home</span></a>
  </header>

  <main class="flex-1 overflow-y-auto pb-24 px-5 pt-6 space-y-4">
    <!-- Hunter Info Panel -->
    <div class="pixel-border bg-slate-900/80 border border-primary/40 rounded-sm p-5 space-y-4">
      <div>
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">UID</span>
        <p class="text-white font-mono text-lg mt-0.5">unknown</p>
      </div>
      <div>
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">EMAIL</span>
        <p class="text-white font-mono text-lg uppercase mt-0.5">unknown</p>
      </div>
      <div>
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">HUNTER ID</span>
        <p class="text-white font-mono text-lg uppercase mt-0.5">unknown</p>
      </div>
      <div>
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">NAME</span>
        <p class="text-white font-mono text-lg mt-0.5">Rookie Hunter</p>
      </div>
      <div>
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">GUILD RANK</span>
        <p class="text-white font-mono text-lg mt-0.5">E-CLASS</p>
      </div>
    </div>

    <!-- Age Panel -->
    <div class="pixel-border bg-slate-900/80 border border-primary/40 rounded-sm p-5">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[#7aaef8] font-pixel text-[10px] tracking-wider">AGE</span>
        <button id="age-edit-btn" onclick="startEditAge()" class="text-[#7aaef8] hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-lg">edit</span>
        </button>
      </div>

      <!-- Display mode -->
      <p id="age-display" class="text-white font-mono text-lg">Not set</p>

      <!-- Edit mode (hidden by default) -->
      <div id="age-edit-row" class="hidden flex items-center gap-2 mt-1">
        <input id="age-input" type="number" min="1" max="999" maxlength="3" placeholder="Enter age"
          class="flex-1 h-10 bg-[#0f172a] border border-primary/45 text-white px-3 font-mono text-lg rounded-none focus:outline-none focus:border-primary placeholder-slate-500" />
        <button id="age-confirm-btn" onclick="confirmAge()"
          class="w-9 h-9 bg-primary rounded flex items-center justify-center hover:bg-primary/80 transition-colors">
          <span class="material-symbols-outlined text-white text-xl">check</span>
        </button>
        <button onclick="cancelEditAge()"
          class="w-9 h-9 bg-[#1f2937] border border-red-400/30 rounded flex items-center justify-center hover:bg-[#1f2937]/80 transition-colors">
          <span class="material-symbols-outlined text-red-400 text-xl">close</span>
        </button>
      </div>

      <p class="text-slate-500 text-xs mt-2">Used to calculate recommended sleep hours</p>
    </div>
  </main>

  <script>
      // Load saved age from localStorage on page load
      (function loadAge() {
        const saved = localStorage.getItem('levelup_profile_age');
        if (saved) {
          document.getElementById('age-display').textContent = saved;
        }
      })();

    function startEditAge() {
      document.getElementById('age-display').classList.add('hidden');
      document.getElementById('age-edit-btn').classList.add('hidden');
      document.getElementById('age-edit-row').classList.remove('hidden');
      const input = document.getElementById('age-input');
      const current = localStorage.getItem('levelup_profile_age');
      input.value = current || '';
      input.focus();
    }

    function confirmAge() {
      const input = document.getElementById('age-input');
      const cleaned = input.value.replace(/[^0-9]/g, '').slice(0, 3);
      const n = Number(cleaned);

      if (!cleaned || !Number.isFinite(n) || n <= 0) {
        alert('Please enter a valid age greater than 0.');
        return;
      }

      localStorage.setItem('levelup_profile_age', String(n));
      document.getElementById('age-display').textContent = String(n);
      cancelEditAge();
    }

    function cancelEditAge() {
      document.getElementById('age-display').classList.remove('hidden');
      document.getElementById('age-edit-btn').classList.remove('hidden');
      document.getElementById('age-edit-row').classList.add('hidden');
    }

    // Allow Enter key to confirm
    document.getElementById('age-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') confirmAge();
      if (e.key === 'Escape') cancelEditAge();
    });
  </script>

  <nav class="fixed bottom-0 left-0 right-0 bg-[#101823] border-t border-[#223249] z-50">
    <div class="flex justify-between items-stretch h-16">
      <a class="flex-1 flex flex-col items-center justify-center gap-1 group relative" href="status.html">
        <div class="absolute top-0 left-0 right-0 h-0.5 bg-primary shadow-[0_0_8px_#257bf4]"></div>
        <div class="absolute inset-0 bg-primary/10 opacity-100 transition-opacity"></div>
        <span
          class="material-symbols-outlined text-primary text-2xl group-hover:scale-110 transition-transform">person</span>
        <span class="text-[10px] font-bold text-primary tracking-wider">STATUS</span>
      </a>
      <a class="flex-1 flex flex-col items-center justify-center gap-1 group text-slate-500 hover:text-primary transition-colors"
        href="quests.html"><span
          class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">swords</span><span
          class="text-[10px] font-bold tracking-wider">QUESTS</span></a>
      <a class="flex-1 flex flex-col items-center justify-center gap-1 group text-slate-500 hover:text-primary transition-colors"
        href="log.html"><span
          class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">history_edu</span><span
          class="text-[10px] font-bold tracking-wider">LOG</span></a>
      <a class="flex-1 flex flex-col items-center justify-center gap-1 group text-slate-500 hover:text-primary transition-colors"
        href="analytics.html"><span
          class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">monitoring</span><span
          class="text-[10px] font-bold tracking-wider">ANALYTICS</span></a>
      <a class="flex-1 flex flex-col items-center justify-center gap-1 group text-slate-500 hover:text-primary transition-colors"
        href="coach.html"><span
          class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">sports_martial_arts</span><span
          class="text-[10px] font-bold tracking-wider">COACH</span></a>
    </div>
  </nav>
</body>

</html>
